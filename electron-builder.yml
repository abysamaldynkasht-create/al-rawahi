appId: om.alrawahi.garage
productName: AL RAWAHI GARAGE MANAGEMENT SYSTEM
copyright: Copyright © 2026 AL RAWAHI GARAGE. Developed by AKASHA AI.

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/better-sqlite3/**/*

asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AL RAWAHI GARAGE
  uninstallDisplayName: AL RAWAHI GARAGE MANAGEMENT SYSTEM
  deleteAppDataOnUninstall: false # CRITICAL: Preserve business database in %APPDATA%
